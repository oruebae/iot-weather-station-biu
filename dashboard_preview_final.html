<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Weather Station [PREVIEW]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .weather-card-bg {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
        }

        .bar-container {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 40px;
        }

        .bar {
            width: 6px;
            background-color: #E2E8F0;
            border-radius: 4px;
            transition: height 0.3s, background-color 0.3s;
        }

        .bar.active {
            background-color: #3B82F6;
        }

        .circle-chart {
            width: 70px;
            height: 70px;
        }

        .circle-bg {
            fill: none;
            stroke: #E2E8F0;
            stroke-width: 4;
        }

        .circle {
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            transition: stroke-dasharray 1s ease;
        }
    </style>
</head>

<body class="bg-indigo-50 text-slate-600 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-end mb-8 gap-4">
            <div class="flex items-center gap-4">
                <div
                    class="h-12 w-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center shadow-lg shadow-indigo-200">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z">
                        </path>
                    </svg>
                </div>
                <div>
                    <!-- Device Selector (Mock) -->
                    <select id="device-selector"
                        class="text-2xl font-bold text-slate-800 bg-transparent border-none focus:ring-0 p-0 cursor-pointer mb-1 outline-none">
                        <option value="STATION-01" selected>Estación Principal</option>
                        <option value="STATION-02">Estación Secundaria</option>
                    </select>

                    <div class="flex items-center gap-2">
                        <span id="status-dot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span id="status-text"
                            class="text-xs font-semibold text-emerald-600 uppercase tracking-wider">En Línea</span>
                    </div>
                </div>
            </div>

            <!-- Date Filter -->
            <div class="flex bg-white rounded-xl p-1 shadow-sm border border-slate-100">
                <input type="date" id="date-picker"
                    class="bg-transparent border-none text-sm text-slate-600 font-medium cursor-pointer focus:ring-0 px-3 py-2">
                <button id="btn-today"
                    class="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-lg text-sm font-bold hover:bg-indigo-100 transition-colors">Hoy</button>
            </div>
        </header>

        <!-- Dynamic Content -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

            <!-- Left: Main Weather Card (4 cols) -->
            <div class="lg:col-span-4 space-y-6">
                <div
                    class="glass-panel rounded-3xl p-8 shadow-xl shadow-indigo-100/50 relative overflow-hidden border-t-4 border-indigo-500">
                    <div class="relative z-10">
                        <div class="flex justify-between items-start mb-8">
                            <div>
                                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Temperatura</h2>
                                <p class="text-xs text-slate-400 mt-1" id="card-context">Reciente</p>
                            </div>
                            <div id="weather-icon"></div>
                        </div>

                        <div class="flex items-baseline mb-2">
                            <span class="text-7xl font-bold text-slate-800 tracking-tighter" id="val-temp">--</span>
                            <span class="text-3xl text-slate-400 font-medium ml-1">°C</span>
                        </div>
                        <p class="text-lg font-medium text-indigo-600 mb-6" id="weather-state">--</p>

                        <div class="grid grid-cols-3 gap-2 py-4 border-t border-slate-100">
                            <div class="text-center">
                                <p class="text-[0.65rem] uppercase text-slate-400 font-bold mb-1">Mín</p>
                                <p class="text-lg font-bold text-slate-700" id="val-min">--</p>
                            </div>
                            <div class="text-center border-l border-r border-slate-100">
                                <p class="text-[0.65rem] uppercase text-slate-400 font-bold mb-1">Máx</p>
                                <p class="text-lg font-bold text-slate-700" id="val-max">--</p>
                            </div>
                            <div class="text-center">
                                <p class="text-[0.65rem] uppercase text-slate-400 font-bold mb-1">Tendencia</p>
                                <p class="text-lg font-bold text-emerald-500" id="val-trend">--</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Secondary Metrics -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="glass-panel rounded-3xl p-5 shadow-sm weather-card-bg relative overflow-hidden">
                        <div class="absolute right-2 top-2 opacity-10">
                            <svg class="w-12 h-12 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z">
                                </path>
                            </svg>
                        </div>
                        <div class="flex justify-between items-center mb-4"><span
                                class="text-xs font-bold text-slate-400 uppercase">Humedad</span></div>
                        <div class="flex items-end justify-between relative z-10">
                            <div><span class="text-2xl font-bold text-slate-800" id="val-hum">--</span><span
                                    class="text-sm text-slate-400">%</span></div>
                            <div class="bar-container" id="hum-bars"></div>
                        </div>
                    </div>
                    <div class="glass-panel rounded-3xl p-5 shadow-sm weather-card-bg relative overflow-hidden">
                        <div class="absolute right-2 top-2 opacity-10">
                            <svg class="w-12 h-12 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                        <div class="flex justify-between items-center mb-2"><span
                                class="text-xs font-bold text-slate-400 uppercase">Presión</span></div>
                        <div class="flex items-center justify-center py-1 relative z-10">
                            <div class="relative flex items-center justify-center">
                                <svg class="circle-chart" viewBox="0 0 36 36">
                                    <path class="circle-bg"
                                        d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    <path class="circle" id="press-circle" stroke="#10B981" stroke-dasharray="0, 100"
                                        d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                </svg>
                                <div class="absolute text-center mt-1"><span
                                        class="block text-xs font-bold text-slate-800 leading-tight"
                                        id="val-press">--</span><span
                                        class="block text-[0.5rem] text-slate-400">hPa</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: Charts (8 cols) -->
            <div class="lg:col-span-8 space-y-6">
                <!-- Chart -->
                <div class="glass-panel rounded-3xl p-8 shadow-sm bg-white h-96 flex flex-col">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-lg font-bold text-slate-800">Evolución & Predicción</h3>
                        <div class="flex gap-4 text-xs font-medium">
                            <span class="flex items-center gap-1 text-orange-500"><span
                                    class="w-2 h-2 rounded-full bg-orange-500"></span> Real</span>
                            <span class="flex items-center gap-1 text-indigo-500"><span
                                    class="w-2 h-2 rounded-full bg-indigo-500"></span> EMA (α=0.3)</span>
                        </div>
                    </div>
                    <div class="flex-1 w-full relative">
                        <canvas id="weatherChart"></canvas>
                    </div>
                </div>

                <!-- Alerts & Activity -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass-panel rounded-3xl p-6 shadow-sm bg-white">
                        <h3
                            class="text-sm font-bold text-slate-800 uppercase tracking-wide mb-4 flex items-center gap-2">
                            Alertas Recientes
                        </h3>
                        <div class="space-y-3 max-h-40 overflow-y-auto pr-2" id="alerts-container">
                            <!-- Alerts injected here -->
                        </div>
                    </div>
                    <div class="glass-panel rounded-3xl p-6 shadow-sm bg-white">
                        <h3
                            class="text-sm font-bold text-slate-800 uppercase tracking-wide mb-4 flex items-center gap-2">
                            Actividad Reciente
                        </h3>
                        <div class="space-y-3 max-h-40 overflow-y-auto pr-2" id="activity-container">
                            <!-- Activity injected here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // INIT STATE
        document.getElementById('date-picker').value = new Date().toLocaleDateString('en-CA');

        // MOCK DATA GENERATION
        const generateMockData = () => {
            const data = [];
            const now = new Date();
            let temp = 24.5;
            let ema = 24.5;
            const alpha = 0.3;

            for (let i = 100; i >= 0; i--) {
                const time = new Date(now.getTime() - i * 15 * 60000); // every 15 mins

                // Random walk
                temp += (Math.random() - 0.5) * 1.5;

                // EMA
                ema = (temp * alpha) + (ema * (1 - alpha));

                data.push({
                    created_at: time,
                    temperature: temp.toFixed(2),
                    ema_temperature: ema.toFixed(2)
                });
            }
            return data;
        };

        const mockData = generateMockData();
        const latest = mockData[mockData.length - 1];

        // RENDER UI
        document.getElementById('val-temp').textContent = latest.temperature;
        document.getElementById('val-hum').textContent = "45"; // Static
        document.getElementById('val-press').textContent = "1012"; // Static
        document.getElementById('weather-state').textContent = "Soleado"; // Static for preview

        // Icon
        const sunnyIcon = '<svg class="w-16 h-16 text-orange-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>';
        document.getElementById('weather-icon').innerHTML = sunnyIcon;

        document.getElementById('val-min').innerText = "22.1";
        document.getElementById('val-max').innerText = "28.4";
        document.getElementById('val-trend').innerText = "+0.2°";

        // Hum Bars (Mock)
        const humContainer = document.getElementById('hum-bars');
        humContainer.innerHTML = '';
        [20, 40, 60, 80, 100].forEach((l, i) => {
            const bar = document.createElement('div');
            // Mock val 45 => 20, 40 active
            const isActive = 45 >= (l - 15);
            bar.className = `bar ${isActive ? 'active' : ''}`;
            bar.style.height = `${(i + 1) * 6 + 5}px`;
            humContainer.appendChild(bar);
        });

        // Chart
        const ctx = document.getElementById('weatherChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: mockData.map(d => d.created_at.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })),
                datasets: [
                    {
                        label: 'Real',
                        data: mockData.map(d => d.temperature),
                        borderColor: '#F97316',
                        backgroundColor: 'rgba(249, 115, 22, 0.05)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true
                    },
                    {
                        label: 'EMA',
                        data: mockData.map(d => d.ema_temperature),
                        borderColor: '#6366F1',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        tension: 0.4,
                        pointRadius: 0
                    }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: { legend: { display: false } },
                elements: { point: { radius: 0, hitRadius: 10 } },
                scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } }, y: { grid: { color: '#f8fafc' } } }
            }
        });

        // Alerts Mock
        const alertsContainer = document.getElementById('alerts-container');
        alertsContainer.innerHTML = `
            <div class="flex items-start gap-3 border-b border-slate-50 pb-3 last:border-0">
                <div class="mt-1 w-2 h-2 rounded-full bg-red-500"></div>
                <div>
                   <p class="text-xs font-bold text-slate-700 uppercase">TEMP (ABOVE)</p>
                   <p class="text-xs text-slate-400">10:30 AM - Val: 30.5</p>
                </div>
            </div>
             <div class="flex items-start gap-3 border-b border-slate-50 pb-3 last:border-0">
                <div class="mt-1 w-2 h-2 rounded-full bg-red-500"></div>
                <div>
                   <p class="text-xs font-bold text-slate-700 uppercase">HUM (BELOW)</p>
                   <p class="text-xs text-slate-400">09:15 AM - Val: 19.0</p>
                </div>
            </div>
        `;

        // Activity Mock
        const activityContainer = document.getElementById('activity-container');
        activityContainer.innerHTML = `
             <div class="flex items-center justify-between border-b border-slate-50 pb-2 last:border-0 text-sm">
                 <span class="text-slate-500">10:45 AM</span>
                 <span class="font-medium text-slate-700">25.5°C / 45%</span>
            </div>
            <div class="flex items-center justify-between border-b border-slate-50 pb-2 last:border-0 text-sm">
                 <span class="text-slate-500">10:30 AM</span>
                 <span class="font-medium text-slate-700">25.3°C / 46%</span>
            </div>
             <div class="flex items-center justify-between border-b border-slate-50 pb-2 last:border-0 text-sm">
                 <span class="text-slate-500">10:15 AM</span>
                 <span class="font-medium text-slate-700">25.0°C / 44%</span>
            </div>
        `;
    </script>
</body>

</html>
