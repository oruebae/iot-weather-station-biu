<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Weather Station [PREVIEW]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .weather-card-bg {
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
        }

        .bar-container {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 40px;
        }

        .bar {
            width: 6px;
            background-color: #E2E8F0;
            border-radius: 4px;
            transition: height 0.3s, background-color 0.3s;
        }

        .bar.active {
            background-color: #3B82F6;
        }

        /* Circular Progress */
        .circle-chart {
            width: 70px;
            height: 70px;
        }

        .circle-bg {
            fill: none;
            stroke: #E2E8F0;
            stroke-width: 4;
        }

        .circle {
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            transition: stroke-dasharray 1s ease;
        }

        .day-pill {
            @apply px-4 py-2 rounded-xl text-sm transition-all text-slate-500 hover:bg-white/50 whitespace-nowrap cursor-pointer select-none;
        }

        .day-pill.active {
            @apply bg-white text-slate-800 shadow-sm font-bold;
        }

        input[type="date"] {
            background: transparent;
            border: none;
            color: #64748b;
            font-family: 'Outfit';
            font-size: 0.875rem;
            cursor: pointer;
        }

        input[type="date"]:focus {
            outline: none;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-600 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-end mb-8 pl-1 gap-4">
            <div>
                <p class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-1">IoT Monitoring</p>
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-100 p-2 rounded-xl text-indigo-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z">
                            </path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-slate-800 leading-none">Simulación UI</h1>
                        <span class="text-sm text-slate-500 font-medium" id="context-label">En Vivo</span>
                    </div>
                </div>
            </div>

            <!-- Date Filter Control -->
            <div class="flex gap-2 items-center">
                <div class="glass-panel p-1.5 rounded-2xl flex gap-1 shadow-sm" id="date-filters">
                    <button class="day-pill active" onclick="switchDate('today', this)">Hoy</button>
                    <button class="day-pill" onclick="switchDate('yesterday', this)">Ayer</button>
                    <button class="day-pill" onclick="switchDate('past', this)">Anteayer</button>
                </div>
                <div
                    class="glass-panel p-2 rounded-2xl shadow-sm flex items-center justify-center w-12 h-12 hover:bg-white transition-colors">
                    <div class="relative overflow-hidden w-6 h-6">
                        <svg class="w-6 h-6 text-indigo-400 absolute pointer-events-none" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                            </path>
                        </svg>
                        <input type="date" class="opacity-0 w-full h-full absolute inset-0 cursor-pointer"
                            onchange="switchDate('custom', this)">
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left Column -->
            <div class="lg:col-span-1 space-y-6">
                <!-- Temp Card -->
                <div
                    class="glass-panel rounded-3xl p-6 shadow-xl shadow-indigo-100/50 relative overflow-hidden border-t-4 border-indigo-400">
                    <div class="flex justify-between items-start">
                        <div>
                            <span
                                class="inline-block px-2 py-1 rounded-md bg-indigo-50 text-indigo-600 text-xs font-bold uppercase mb-2">Temperatura</span>
                            <div class="flex items-baseline">
                                <span class="text-6xl font-bold text-slate-800 tracking-tight" id="val-temp">24.5</span>
                                <span class="text-2xl text-slate-400 ml-1">°C</span>
                            </div>
                            <p class="text-slate-500 font-medium mt-1 text-sm" id="card-context">Reciente</p>
                        </div>
                    </div>
                    <div class="mt-6 pt-4 border-t border-slate-100 flex justify-between items-center text-sm">
                        <div class="flex gap-4">
                            <div>
                                <p class="text-slate-400 text-xs text-center uppercase">Mín</p>
                                <p class="font-bold text-slate-700 text-lg">22°</p>
                            </div>
                            <div>
                                <p class="text-slate-400 text-xs text-center uppercase">Máx</p>
                                <p class="font-bold text-slate-700 text-lg">28°</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-slate-400 text-xs uppercase">Tendencia</p>
                            <p class="font-bold text-emerald-500">+0.2°</p>
                        </div>
                    </div>
                </div>
                <!-- Secondary -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="glass-panel rounded-3xl p-5 shadow-sm weather-card-bg">
                        <div class="flex justify-between items-center mb-4"><span
                                class="text-xs font-bold text-slate-400">HUMEDAD</span></div>
                        <div class="flex items-end justify-between">
                            <div><span class="text-2xl font-bold text-slate-800" id="val-hum">60</span><span
                                    class="text-sm text-slate-400">%</span></div>
                            <div class="bar-container" id="hum-bars"></div>
                        </div>
                    </div>
                    <div class="glass-panel rounded-3xl p-5 shadow-sm weather-card-bg">
                        <div class="flex justify-between items-center mb-2"><span
                                class="text-xs font-bold text-slate-400">PRESIÓN</span></div>
                        <div class="flex items-center justify-center py-1">
                            <div class="relative flex items-center justify-center">
                                <svg class="circle-chart" viewBox="0 0 36 36">
                                    <path class="circle-bg"
                                        d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    <path class="circle" stroke="#10B981" stroke-dasharray="80, 100"
                                        d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                </svg>
                                <div class="absolute text-center mt-1"><span
                                        class="block text-xs font-bold text-slate-800 leading-tight"
                                        id="val-press">1012</span><span
                                        class="block text-[0.5rem] text-slate-400">hPa</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="lg:col-span-2 space-y-6">
                <div class="glass-panel rounded-3xl p-6 shadow-sm bg-white">
                    <h3 class="text-lg font-bold text-slate-800 mb-6">Gráfico de Tendencia</h3>
                    <div class="h-64 w-full"><canvas id="weatherChart"></canvas></div>
                </div>
                <div class="glass-panel rounded-3xl p-6 shadow-sm bg-white">
                    <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wide mb-4">Registro de Alertas</h3>
                    <div class="space-y-3">
                        <div class="flex items-center p-3 rounded-xl bg-slate-50 border border-slate-100">
                            <div
                                class="h-8 w-8 rounded-full bg-red-50 text-red-500 flex items-center justify-center mr-3 shrink-0">
                                !</div>
                            <div>
                                <p class="text-xs font-bold text-slate-700 uppercase">Temperatura Alta</p>
                                <p class="text-[0.65rem] text-slate-400">32.5°C</p>
                            </div>
                            <span class="ml-auto text-[0.65rem] text-slate-400">Hace 1h</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // MOCK LOGIC FOR PREVIEW
        const ctx = document.getElementById('weatherChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: { labels: ['10:00', '10:30', '11:00'], datasets: [{ label: 'Real', data: [22, 23, 24.5], borderColor: '#F97316', borderWidth: 3, tension: 0.4 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
        });

        function switchDate(mode, el) {
            document.querySelectorAll('.day-pill').forEach(b => b.classList.remove('active'));
            if (el.tagName === 'BUTTON') el.classList.add('active');

            // Mock Data Switch
            let temp = 24.5;
            let label = 'En Vivo';
            if (mode === 'yesterday') { temp = 21.0; label = 'Cierre Ayer'; }
            if (mode === 'past') { temp = 19.5; label = 'Final del Día'; }

            document.getElementById('val-temp').innerText = temp;
            document.getElementById('context-label').innerText = label;
            document.getElementById('card-context').innerText = mode === 'today' ? 'Reciente' : 'Histórico';

            // Re-render mock chart
            chart.data.datasets[0].data = mode === 'today' ? [22, 23, 24.5] : [20, 21, 20];
            chart.update();
        }

        // Init Bars
        const container = document.getElementById('hum-bars');
        [20, 40, 60, 80, 100].forEach((l, i) => {
            const bar = document.createElement('div');
            bar.className = `bar ${60 >= l ? 'active' : ''}`;
            bar.style.height = `${(i + 1) * 5 + 10}px`;
            container.appendChild(bar);
        });
    </script>
</body>

</html>
